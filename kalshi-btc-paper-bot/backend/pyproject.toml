[project]
name = "kalshi-btc-paper-bot"
version = "1.0.0"
description = "Local PAPER trading bot for Kalshi 15-minute Bitcoin UP/DOWN markets (simulated money, real public market data)"
requires-python = ">=3.12"
# Pinned, cross-platform lockfiles: requirements.txt (runtime) and requirements-dev.txt (tests),
# generated from requirements.in / requirements-dev.in with `uv pip compile --universal`.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette's TestClient (used only by tests/test_api.py) warns about its own httpx transport.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
